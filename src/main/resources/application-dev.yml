spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000  # SMTP 서버 연결 대기 시간
          timeout: 5000            # 응답 대기 시간
          writetimeout: 5000       # 데이터 전송 대기 시간
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/v1/oauth/google/callback}
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile

# Nginx가 전달한 X-Forwarded-For/Proto 헤더를 Tomcat이 처리하도록 설정
# Nginx를 거치지 않은 8080 직접 접근은 네트워크 수준에서 차단해야 함
server:
  forward-headers-strategy: native

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

oauth:
  frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}
  google-link-redirect-uri: ${GOOGLE_LINK_REDIRECT_URI:http://localhost:8080/auth/v1/oauth/google/link/callback}
  frontend-link-redirect-uri: ${OAUTH_FRONTEND_LINK_REDIRECT_URI:http://localhost:3000/settings/account}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://omo-fe.vercel.app}

aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    profile-bucket: ${PROFILE_BUCKET}
    inquiry-bucket: ${INQUIRY_BUCKET}
    presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gemini:
  api:
    key: ${GEMINI_API_KEY:jwt-test-key}
    model: gemini-3.1-flash-lite
